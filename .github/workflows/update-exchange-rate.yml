name: Update USD Exchange Rate

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  update-rate:
    runs-on: ubuntu-latest
    steps:
      - name: Update exchange rate
        env:
          API_URL: ${{ secrets.EXCHANGE_RATE_API_URL }}
          API_TOKEN: ${{ secrets.EXCHANGE_RATE_UPDATE_TOKEN }}
        run: |
          curl --fail-with-body --show-error --silent \
            --retry 3 --retry-delay 10 --retry-all-errors \
            --max-time 120 \
            -X POST "$API_URL" \
            -H "X-Exchange-Token: $API_TOKEN"
