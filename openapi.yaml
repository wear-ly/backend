components:
  schemas:
    Brand:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        slug:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        name:
          type: string
          maxLength: 255
        is_active:
          type: boolean
        is_hidden:
          type: boolean
      required:
      - created_at
      - id
      - name
      - updated_at
    CartItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        product_variant:
          type: integer
        quantity:
          type: integer
          maximum: 2147483647
          minimum: 0
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - product_variant
      - updated_at
    CartItemRequest:
      type: object
      properties:
        product_variant:
          type: integer
        quantity:
          type: integer
          maximum: 2147483647
          minimum: 0
      required:
      - product_variant
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        slug:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        name:
          type: string
          maxLength: 255
        is_active:
          type: boolean
        is_hidden:
          type: boolean
      required:
      - created_at
      - id
      - name
      - updated_at
    Color:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 50
        hex_code:
          type: string
          maxLength: 7
        is_active:
          type: boolean
      required:
      - hex_code
      - id
      - name
    Currency:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        product_variant:
          type: integer
        currency_code:
          type: string
          maxLength: 3
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
      required:
      - amount
      - currency_code
      - id
      - product_variant
    CustomTokenObtainPair:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - refresh
    CustomTokenObtainPairRequest:
      type: object
      properties:
        email_or_phone:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email_or_phone
      - password
    CustomTokenRefresh:
      type: object
      properties:
        refresh:
          type: string
        access:
          type: string
          readOnly: true
      required:
      - access
      - refresh
    CustomTokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    DetailResponse:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    Discount:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        product_variant:
          type: integer
        discount_type:
          type: string
          maxLength: 20
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
        is_active:
          type: boolean
      required:
      - amount
      - discount_type
      - end_at
      - id
      - product_variant
      - start_at
    ErrorDetail:
      type: object
      description: Body of DRF auth / permission / not-found / throttle errors.
      properties:
        detail:
          type: string
        code:
          type: string
      required:
      - detail
    Favorite:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
        product_variant:
          type: integer
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - product_variant
      - updated_at
      - user
    FavoriteRequest:
      type: object
      properties:
        product_variant:
          type: integer
      required:
      - product_variant
