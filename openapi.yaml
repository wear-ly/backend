          readOnly: true
      required:
      - created_at
      - id
      - product_variant
      - updated_at
    GoogleAuthRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
        accept_terms:
          type: boolean
          writeOnly: true
      required:
      - accept_terms
      - token
