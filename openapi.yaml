openapi: 3.1.0
info:
  title: Wearly API
  version: 1.0.0
  description: |-
    REST API of the Wearly online shop.

    Authenticate via `POST /api/login/`, then send the `access` token as `Authorization: Bearer <token>`. Refresh it with `POST /api/token/refresh/`.
